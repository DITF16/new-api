name: Build Docker image artifact (Linux ARM64)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to export
        required: false
        default: arm64-latest
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build Linux ARM64 image tar
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="arm64-${GITHUB_SHA::12}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and export Linux ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          tags: new-api:${{ steps.tag.outputs.tag }}
          outputs: type=oci,dest=/tmp/new-api-linux-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-linux-arm64
          path: /tmp/new-api-linux-arm64.tar
          if-no-files-found: error
          retention-days: 14

      - name: Write load instructions
        run: |
          {
            echo '# Linux ARM64 Docker image'
            echo
            echo 'Download the `new-api-linux-arm64` artifact, then run:'
            echo
            echo '```sh'
            echo 'docker load --input new-api-linux-arm64.tar'
            echo 'docker image ls new-api'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
